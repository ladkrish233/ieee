<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEEE Paper Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --cream: #F4F1EA;
        --ink: #2B2A28;
        --terracotta: #D97757;
        --terracotta-dark: #BD5F42;
        --line: #DDD8CB;
        --muted: #7A756A;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        display: flex;
        justify-content: center;
        padding: 64px 20px;
    }

    .card {
        width: 100%;
        max-width: 560px;
    }

    h1 {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 34px;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
    }

    .subtitle {
        color: var(--muted);
        font-size: 15px;
        margin: 0 0 40px;
        line-height: 1.5;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-top: 24px;
        margin-bottom: 6px;
        color: var(--muted);
    }

    input[type="text"], input[type="number"] {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        font-family: 'Inter', sans-serif;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
    }

    input:focus {
        outline: none;
        border-color: var(--terracotta);
        box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.15);
    }

    button {
        margin-top: 32px;
        width: 100%;
        padding: 13px 20px;
        font-size: 15px;
        font-weight: 500;
        font-family: 'Inter', sans-serif;
        color: #fff;
        background: var(--terracotta);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease;
    }

    button:hover:not(:disabled) { background: var(--terracotta-dark); }

    button:disabled {
        background: var(--line);
        color: var(--muted);
        cursor: not-allowed;
    }

    #status {
        margin-top: 20px;
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
    }

    #download-link {
        display: none;
        margin-top: 12px;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        text-decoration: none;
        color: var(--terracotta-dark);
        font-weight: 500;
        font-size: 14px;
    }

    #download-link:hover { border-color: var(--terracotta); }
</style>
</head>
<body>
    <div class="card">
        <h1>IEEE Paper Generator</h1>
        <p class="subtitle">Give it a topic, get a formatted IEEE draft back — outline, sections, abstract, and references, generated end to end.</p>

        <label for="topic">Research topic</label>
        <input type="text" id="topic" placeholder="e.g. Federated learning for edge devices">

        <label for="word-count">Target word count</label>
        <input type="number" id="word-count" value="3000">

        <button id="generate-btn">Generate paper</button>

        <div id="status"></div>
        <a id="download-link" href="#">Download your IEEE paper (.docx)</a>
    </div>

    <script>
        const btn = document.getElementById("generate-btn");
        const statusEl = document.getElementById("status");
        const downloadLink = document.getElementById("download-link");

        btn.addEventListener("click", async () => {
            const topic = document.getElementById("topic").value.trim();
            const wordCount = parseInt(document.getElementById("word-count").value, 10);

            if (!topic) {
                statusEl.textContent = "Enter a topic to get started.";
                return;
            }

            btn.disabled = true;
            downloadLink.style.display = "none";
            statusEl.textContent = "Generating your paper — this can take a minute or two.";

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ topic, total_word_target: wordCount }),
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Something went wrong.");
                }

                const data = await response.json();
                statusEl.textContent = "Done — your paper is ready.";
                downloadLink.href = `/download/${data.file_id}`;
                downloadLink.style.display = "block";
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
